media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 所有文章 · 南极探索分区
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    subfolders: true
    # MDX contains imports/JSX; keep it out of the WYSIWYG save pipeline.
    exclude: ["*.mdx", "**/*.mdx", "**/assets/**"]
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, region, pubDatetime, tags, draft, featured]
      primary: title
      sort: [pubDatetime, title]
      search: [title, region]
      default:
        sort: pubDatetime
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: pubDatetime
        label: 发布时间
        type: date
        required: true
        description: 按当前浏览器本地时间选择，保存时包含时区偏移。
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: region
        label: 发布到哪个南极分区
        type: select
        required: true
        description: 麦克默多干谷=技术学习；1810号科考站=生活成长；洛克罗伊港=世界观察；不可接近之极=自由探索。旧文章未分区时仍在全站文章列表显示。
        options:
          multiple: false
          values:
            - name: dry-valleys
              label: 麦克默多干谷（技术与学习）
            - name: station-1810
              label: 1810号科考站（生活与成长）
            - name: port-lockroy
              label: 洛克罗伊港（社会与世界观察）
            - name: inaccessibility
              label: 不可接近之极（自由探索）
      - name: tags
        label: 标签
        type: string
        list: true
        default: [others]
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: featured
        label: 精选
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        description: 含公式、HTML、callout 等特殊语法时，请使用 Source 模式编辑并检查保存差异。MDX 请通过 GitHub 编辑。
        options:
          format: markdown
          switcher: true

  - name: about
    label: 关于我
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true

settings:
  content:
    merge: true
