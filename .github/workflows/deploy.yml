name: Deploy Astro blog to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh public GitHub repository metadata even when the blog code is unchanged.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build and upload Astro site
        uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_POLAR_SUPABASE_URL: ${{ vars.PUBLIC_POLAR_SUPABASE_URL }}
          PUBLIC_POLAR_SUPABASE_KEY: ${{ vars.PUBLIC_POLAR_SUPABASE_KEY }}
          PUBLIC_POLAR_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_POLAR_TURNSTILE_SITE_KEY }}
        with:
          node-version: 24
      - name: Synchronize article catalog before release
        run: node scripts/polar-catalog.mjs
        env:
          PUBLIC_POLAR_SUPABASE_URL: ${{ vars.PUBLIC_POLAR_SUPABASE_URL }}
          PUBLIC_POLAR_SUPABASE_KEY: ${{ vars.PUBLIC_POLAR_SUPABASE_KEY }}
          POLAR_CATALOG_SIGNING_KEY: ${{ secrets.POLAR_CATALOG_SIGNING_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
